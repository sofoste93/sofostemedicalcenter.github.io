name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: Sofoste-Medical-Center-Windows-x64
            package: Sofoste-Medical-Center-Windows-x64.zip
          - os: ubuntu-latest
            executable: Sofoste-Medical-Center-Linux-x64
            package: Sofoste-Medical-Center-Linux-x64.tar.gz
          - os: macos-15-intel
            executable: Sofoste-Medical-Center-macOS-x64
            package: Sofoste-Medical-Center-macOS-x64.tar.gz
          - os: macos-15
            executable: Sofoste-Medical-Center-macOS-arm64
            package: Sofoste-Medical-Center-macOS-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --onefile --name "${{ matrix.executable }}" --icon assets/icon.ico --collect-all sofoste_medical_center launcher.py
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/${{ matrix.executable }}.exe --version
      - name: Smoke test Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/${{ matrix.executable }} --version
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.executable }}.exe" -DestinationPath "${{ matrix.package }}"
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ github.workspace }}/${{ matrix.package }}" -C dist "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.executable }}
          path: ${{ matrix.package }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "Sofoste Medical Center 2.0.0 — Serpent of Care" --notes-file CHANGELOG.md
